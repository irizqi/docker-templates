version: '3.9'

services:

  sftpgo:
    image: drakkan/sftpgo:latest
    ports:
      - "8088:8080"
      - "2022:2022"
    environment:
      SFTPGO_DATA_PROVIDER__DRIVER: sqlite
      SFTPGO_HTTPD__BINDINGS__0__PORT: 8080
    volumes:
      - sftpgo_data:/var/lib/sftpgo
      - sftpgo_home:/srv/sftpgo

  master:
    image: chrislusf/seaweedfs
    command: >
      master
      -ip=master
      -ip.bind=0.0.0.0
      -metricsPort=9324
      -mdir=/data
    ports:
      - 9333:9333
      - 19333:19333
      - 9324:9324
    volumes:
      - seaweed_master_data:/data

  admin:
    image: chrislusf/seaweedfs
    command: >
      admin
      -masters="master:9333"
      -port=23646
      -adminUser=${ADMIN_USER}
      -adminPassword=${ADMIN_PASSWORD}
    ports:
      - 23646:23646
    depends_on:
      - master

  volume:
    image: chrislusf/seaweedfs
    command: >
      volume
      -ip=volume
      -master="master:9333"
      -ip.bind=0.0.0.0
      -port=8080
      -metricsPort=9325
      -dir=/data
    ports:
      - 8080:8080
      - 18080:18080
      - 9325:9325
    volumes:
      - seaweed_volume_data:/data
    depends_on:
      - master

  filer:
    image: chrislusf/seaweedfs
    command: >
      filer
      -ip=filer
      -master="master:9333"
      -ip.bind=0.0.0.0
      -metricsPort=9326
      -dir=/data
    ports:
      - 8888:8888
      - 18888:18888
      - 9326:9326
    volumes:
      - seaweed_filer_data:/data
    tty: true
    stdin_open: true
    depends_on:
      - master
      - volume

  s3:
    image: chrislusf/seaweedfs
    command: >
      s3
      -filer="filer:8888"
      -ip.bind=0.0.0.0
      -metricsPort=9327
    ports:
      - 8333:8333
      - 9327:9327
    depends_on:
      - filer

  webdav:
    image: chrislusf/seaweedfs
    command: webdav -filer="filer:8888"
    ports:
      - 7333:7333
    depends_on:
      - filer

  prometheus:
    image: prom/prometheus:v2.21.0
    ports:
      - 9000:9090
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command: --web.enable-lifecycle --config.file=/etc/prometheus/prometheus.yml
    depends_on:
      - s3

volumes:
  sftpgo_data:
  sftpgo_home:

  seaweed_master_data:
  seaweed_volume_data:
  seaweed_filer_data:

  prometheus_data: